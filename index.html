<script>
const D={core379:"كُونُواْ رَبَّـٰنِيِّـۧنَ بِمَا كُنتُمۡ تُعَلِّمُونَ ٱلۡكِتَٰبَ وَبِمَا كُنتُمۡ تَدۡرُسُونَ",v3200:"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱصۡبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُفۡلِحُونَ",found:[{title:"Āyat al-Kursī",n:1,ar:"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡحَيُّ ٱلۡقَيُّومُۚ لَا تَأۡخُذُهُۥ سِنَةٞ وَلَا نَوۡمٞۚ لَّهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِۗ مَن ذَا ٱلَّذِي يَشۡفَعُ عِندَهُۥٓ إِلَّا بِإِذۡنِهِۦۚ يَعۡلَمُ مَا بَيۡنَ أَيۡدِيهِمۡ وَمَا خَلۡفَهُمۡۖ وَلَا يُحِيطُونَ بِشَيۡءٖ مِّنۡ عِلۡمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرۡسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَۖ وَلَا يَـُٔودُهُۥ حِفۡظُهُمَاۚ وَهُوَ ٱلۡعَلِيُّ ٱلۡعَظِيمُ",tr:"Allahu la ilaha illa huwa alhayyu alqayyoomu la takhuthuhu sinatun wala nawmun lahu ma fee alssamawati wama fee alardi man tha allathee yashfaAAu AAindahu illa biithnihi yaAAlamu ma bayna aydeehim wama khalfahum wala yuheetoona bishayin min AAilmihi illa bima shaa wasiAAa kursiyyuhu alssamawati waalarda wala yaooduhu hifthuhuma wahuwa alAAaliyyu alAAatheemu",en:"Allah - there is no deity except Him, the Ever-Living, the Sustainer of [all] existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is [presently] before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Kursi extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great",src:"Al-Baqarah 2:255 · an-Nasāʾī (al-Kubrā), al-Ḥākim",note:"",refl:["Before you start the day, you establish one reality: Allah is alive and in complete control. Nothing moves without His permission. This internalisation produces tawakkul and removes anxiety."]},{title:"Sūrat al-Ikhlāṣ",n:3,ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ",tr:"Bismillaahir-rahmaanir-raheem. Qul huwal-laahu ahad. Allaahus-samad. Lam yalid wa lam yoolad. Wa lam yakul-lahu kufuwan ahad",en:"Say, He is Allah, the One. Allah, the Self-Sufficient on whom all depend. He neither begets nor was He begotten, and there is none comparable to Him.",src:"Sūrah 112",note:"",refl:["Al-Ikhlāṣ declares who Allah is: one, completely independent, utterly unique."]},{title:"Sūrat al-Falaq",n:3,ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",tr:"Bismillaahir-rahmaanir-raheem. Qul aʿoodhu bi rabbil-falaq. Min sharri maa khalaq. Wa min sharri ghaasiqin idhaa waqab. Wa min sharrin-naffaathaati fil-ʿuqad. Wa min sharri haasidin idhaa hasad",en:"Say, I seek refuge in the Lord of daybreak, from the evil of what He has created, from the evil of darkness when it settles, from the evil of those who blow on knots, and from the evil of an envier when he envies.",src:"Sūrah 113",note:"",refl:["Al-Falaq seeks refuge from everything external that could harm: all evil, magic, envy."]},{title:"Sūrat an-Nās",n:3,ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",tr:"Bismillaahir-rahmaanir-raheem. Qul aʿoodhu bi rabbin-naas. Malikin-naas. Ilaahin-naas. Min sharril waswaasil khannaas. Alladhee yuwaswisu fee sudoorin-naas. Minal jinnati wan-naas",en:"Say, I seek refuge in the Lord of mankind, the King of mankind, the God of mankind, from the evil of the retreating whisperer, who whispers in the hearts of mankind, from among the jinn and mankind.",src:"Sūrah 114",note:"",refl:["An-Nās seeks refuge from everything internal: the whisperer who works in the chest.","Together they cover the full spectrum: īmān, external harm, internal harm. Three sūrahs, complete protection."]},{title:"Sayyid al-Istighfār",n:1,ar:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",tr:"Allaahuma anta rabbee laa ilaaha illa ant, khalaqtanee wa ana ʿabduk, wa ana ʿala ʿahdika wa waʿdika mastataʿtu, aʿoodhu bika min sharri ma sanaʿtu, abooʾu laka bi niʿmatika ʿalayya, wa abooʾu bi dhambee, faghfirlee fa innahu laa yaghfirudh-dhunooba illa ant",en:"O Allah! You are my Lord; none has the right to be worshipped but You. You created me and I am Your slave, and I am faithful to my covenant and my commitment to You as far as I am able. I seek Your refuge from the evil of what I have done. I acknowledge before You all the favours You have bestowed upon me and I confess to You all my sins. Forgive me, for there is none who can forgive sins except You.",src:"Ṣaḥīḥ al-Bukhārī 6306",note:"",refl:["It is structured as a covenant renewal."],hadith:{t:"Whoever says it in the morning with certainty and dies that day before evening, he is from the people of Jannah. And whoever says it in the evening with certainty and dies that night before morning, he is from the people of Jannah.",s:"Al-Bukhārī"}},{title:"Bismillāhilladhī lā yaḍurr",n:3,ar:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",tr:"Bismillaahil-ladhee laa yadurru maʿa ismihi shayʾun fil-ardi wa laa fis-samaaʾi wa huwas-samee'ul-ʿaleem",en:"In the Name of Allah, with Whose Name nothing can cause harm on the Earth or in the Heavens, and He is the All-Hearing, the All-Knowing.",src:"Musnad Aḥmad 446 · Sunan at-Tirmidhī 3388",note:"",refl:["In the name of Allah, the One who hears every word spoken against you and knows every plot formed around you.","This dhikr is a declaration that harm has a gatekeeper, and that gatekeeper is Allah alone."],hadith:{t:"There is no man who says it three times in the morning and three times in the evening who will be harmed by anything.",s:"Abū Dāwūd, at-Tirmidhī"}},{title:"Aʿūdhu bi-kalimāt Allāh at-tāmmāt",n:3,ar:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",tr:"Aʿoodhu bi kalimaatil-laahit-taammaati min sharri maa khalaq",en:"I seek refuge in the perfect Words of Allah from the evil of what He has created.",src:"Ṣaḥīḥ Muslim 2708, 2709",note:"",refl:["Seeking refuge in the perfect words of Allah is seeking refuge in something that has no weakness, no gap, and no limit.","From every evil of what He created.","The most perfect protection that exists in creation."]}],complete:[{title:"Sayyid al-Istighfār",n:1,ar:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",tr:"Allaahuma anta rabbee laa ilaaha illa ant, khalaqtanee wa ana ʿabduk, wa ana ʿala ʿahdika wa waʿdika mastataʿtu, aʿoodhu bika min sharri ma sanaʿtu, abooʾu laka bi niʿmatika ʿalayya, wa abooʾu bi dhambee, faghfirlee fa innahu laa yaghfirudh-dhunooba illa ant",en:"O Allah, You are my Lord, none has the right to be worshipped except You. You created me and I am Your servant, and I abide by Your covenant and promise as best I can. I take refuge in You from the evil of what I have committed. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for verily none can forgive sin except You.",src:"Ḥiṣn al-Muslim no. 79 · Ṣaḥīḥ al-Bukhārī 6306",note:"",hisn:79},{title:"Āyat al-Kursī",n:1,ar:"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡحَيُّ ٱلۡقَيُّومُۚ لَا تَأۡخُذُهُۥ سِنَةٞ وَلَا نَوۡمٞۚ لَّهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِۗ مَن ذَا ٱلَّذِي يَشۡفَعُ عِندَهُۥٓ إِلَّا بِإِذۡنِهِۦۚ يَعۡلَمُ مَا بَيۡنَ أَيۡدِيهِمۡ وَمَا خَلۡفَهُمۡۖ وَلَا يُحِيطُونَ بِشَيۡءٖ مِّنۡ عِلۡمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرۡسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَۖ وَلَا يَـُٔودُهُۥ حِفۡظُهُمَاۚ وَهُوَ ٱلۡعَلِيُّ ٱلۡعَظِيمُ",tr:"Allahu la ilaha illa huwa alhayyu alqayyoomu la takhuthuhu sinatun wala nawmun lahu ma fee alssamawati wama fee alardi man tha allathee yashfaAAu AAindahu illa biithnihi yaAAlamu ma bayna aydeehim wama khalfahum wala yuheetoona bishayin min AAilmihi illa bima shaa wasiAAa kursiyyuhu alssamawati waalarda wala yaooduhu hifthuhuma wahuwa alAAaliyyu alAAatheemu",en:"Allah! None has the right to be worshipped but He, the Ever-Living, the Sustainer of all existence. Neither slumber nor sleep overtakes Him. To Him belongs whatever is in the heavens and whatever is on the earth. Who is he that can intercede with Him except with His permission? He knows what is before them and what is behind them, and they encompass nothing of His knowledge except what He wills. His Footstool extends over the heavens and the earth, and guarding them does not tire Him. And He is the Most High, the Most Great.",src:"Ḥiṣn al-Muslim no. 75 · Al-Baqarah 2:255 · an-Nasāʾī (al-Kubrā), al-Ḥākim",note:"",hisn:75},{title:"Sūrat al-Ikhlāṣ",n:3,ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ",tr:"Bismillaahir-rahmaanir-raheem. Qul huwal-laahu ahad. Allaahus-samad. Lam yalid wa lam yoolad. Wa lam yakul-lahu kufuwan ahad",en:"Say, He is Allah, the One. Allah, the Self-Sufficient on whom all depend. He neither begets nor was He begotten, and there is none comparable to Him.",src:"Ḥiṣn al-Muslim no. 76 · Sūrah 112",note:"",hisn:76},{title:"Sūrat al-Falaq",n:3,ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",tr:"Bismillaahir-rahmaanir-raheem. Qul aʿoodhu bi rabbil-falaq. Min sharri maa khalaq. Wa min sharri ghaasiqin idhaa waqab. Wa min sharrin-naffaathaati fil-ʿuqad. Wa min sharri haasidin idhaa hasad",en:"Say, I seek refuge in the Lord of daybreak, from the evil of what He has created, from the evil of darkness when it settles, from the evil of those who blow on knots, and from the evil of an envier when he envies.",src:"Ḥiṣn al-Muslim no. 76 · Sūrah 113",note:"",hisn:76},{title:"Sūrat an-Nās",n:3,ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",tr:"Bismillaahir-rahmaanir-raheem. Qul aʿoodhu bi rabbin-naas. Malikin-naas. Ilaahin-naas. Min sharril waswaasil khannaas. Alladhee yuwaswisu fee sudoorin-naas. Minal jinnati wan-naas",en:"Say, I seek refuge in the Lord of mankind, the King of mankind, the God of mankind, from the evil of the retreating whisperer, who whispers in the hearts of mankind, from among the jinn and mankind.",src:"Ḥiṣn al-Muslim no. 76 · Sūrah 114",note:"",hisn:76},{title:"Entering the day",n:1,src:"Ḥiṣn al-Muslim no. 77 · Muslim",note:"",m:{ar:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",tr:"Asbahnaa wa asbahal mulku lillaah, wal hamdu lillaah, laa ilaaha illal-laahu wahdahu laa shareeka lah, lahul mulku wa lahul hamdu wa huwa ʿalaa kulli shayʾin qadeer, rabbi asʾaluka khayra maa fee haadhal yawmi wa khayra maa baʿdah, wa aʿoodhu bika min sharri maa fee haadhal yawmi wa sharri maa baʿdah, rabbi aʿoodhu bika minal kasali wa sooʾil kibar, rabbi aʿoodhu bika min ʿadhaabin fin-naari wa ʿadhaabin fil qabr",en:"We have reached the morning and at this very time unto Allah belongs all sovereignty, and all praise is for Allah. None has the right to be worshipped except Allah, alone, without partner. To Him belongs all sovereignty and praise and He is over all things omnipotent. My Lord, I ask You for the good of this day and the good of what follows it, and I take refuge in You from the evil of this day and the evil of what follows it. My Lord, I take refuge in You from laziness and senility. My Lord, I take refuge in You from torment in the Fire and punishment in the grave."},e:{ar:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",tr:"Amsaynaa wa amsal mulku lillaah, wal hamdu lillaah, laa ilaaha illal-laahu wahdahu laa shareeka lah, lahul mulku wa lahul hamdu wa huwa ʿalaa kulli shayʾin qadeer, rabbi asʾaluka khayra maa fee haadhihil laylati wa khayra maa baʿdahaa, wa aʿoodhu bika min sharri maa fee haadhihil laylati wa sharri maa baʿdahaa, rabbi aʿoodhu bika minal kasali wa sooʾil kibar, rabbi aʿoodhu bika min ʿadhaabin fin-naari wa ʿadhaabin fil qabr",en:"We have reached the evening and at this very time unto Allah belongs all sovereignty, and all praise is for Allah. None has the right to be worshipped except Allah, alone, without partner. To Him belongs all sovereignty and praise and He is over all things omnipotent. My Lord, I ask You for the good of this night and the good of what follows it, and I take refuge in You from the evil of this night and the evil of what follows it. My Lord, I take refuge in You from laziness and senility. My Lord, I take refuge in You from torment in the Fire and punishment in the grave."},hisn:77},{title:"By Your leave",n:1,src:"Ḥiṣn al-Muslim no. 78 · At-Tirmidhī",note:"",m:{ar:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",tr:"Allaahumma bika asbahnaa, wa bika amsaynaa, wa bika nahyaa, wa bika namootu, wa ilaykan-nushoor",en:"O Allah, by Your leave we have reached the morning and by Your leave we have reached the evening, by Your leave we live and die, and unto You is our resurrection."},e:{ar:"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",tr:"Allaahumma bika amsaynaa, wa bika asbahnaa, wa bika nahyaa, wa bika namootu, wa ilaykal maseer",en:"O Allah, by Your leave we have reached the evening and by Your leave we have reached the morning, by Your leave we live and die, and unto You is our return."},hisn:78},{title:"Calling all creation to witness",n:4,src:"Ḥiṣn al-Muslim no. 80 · Abū Dāwūd",note:"",m:{ar:"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ، وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ",tr:"Allaahumma innee asbahtu ush-hiduka, wa ush-hidu hamalata ʿarshika, wa malaaʾikataka, wa jameeʿa khalqika, annaka antallaahu laa ilaaha illaa ant, wahdaka laa shareeka lak, wa anna Muhammadan ʿabduka wa rasooluk",en:"O Allah, verily I have reached the morning and call on You, the bearers of Your throne, Your angels, and all of Your creation to witness that You are Allah, none has the right to be worshipped except You, alone, without partner, and that Muhammad is Your Servant and Messenger."},e:{ar:"اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ، وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ",tr:"Allaahumma innee amsaytu ush-hiduka, wa ush-hidu hamalata ʿarshika, wa malaaʾikataka, wa jameeʿa khalqika, annaka antallaahu laa ilaaha illaa ant, wahdaka laa shareeka lak, wa anna Muhammadan ʿabduka wa rasooluk",en:"O Allah, verily I have reached the evening and call on You, the bearers of Your throne, Your angels, and all of Your creation to witness that You are Allah, none has the right to be worshipped except You, alone, without partner, and that Muhammad is Your Servant and Messenger."},hisn:80},{title:"Every blessing is from You",n:1,src:"Ḥiṣn al-Muslim no. 81 · Abū Dāwūd",note:"",m:{ar:"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ",tr:"Allaahumma maa asbaha bee min niʿmatin aw bi-ahadin min khalqika fa-minka wahdaka laa shareeka lak, fa-lakal-hamdu wa lakash-shukr",en:"O Allah, what blessing I or any of Your creation have risen upon is from You alone, without partner, so for You is all praise and unto You all thanks."},e:{ar:"اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ",tr:"Allaahumma maa amsaa bee min niʿmatin aw bi-ahadin min khalqika fa-minka wahdaka laa shareeka lak, fa-lakal-hamdu wa lakash-shukr",en:"O Allah, what blessing I or any of Your creation have reached the evening upon is from You alone, without partner, so for You is all praise and unto You all thanks."},hisn:81},{title:"Health in body, hearing and sight",n:3,src:"Ḥiṣn al-Muslim no. 82 · Abū Dāwūd",note:"",ar:"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ",tr:"Allaahumma ʿaafinee fee badanee, Allaahumma ʿaafinee fee samʿee, Allaahumma ʿaafinee fee basaree, laa ilaaha illaa ant. Allaahumma innee aʿoodhu bika minal-kufri wal-faqr, wa aʿoodhu bika min ʿadhaabil-qabr, laa ilaaha illaa ant",en:"O Allah, grant my body health. O Allah, grant my hearing health. O Allah, grant my sight health. None has the right to be worshipped except You. O Allah, I take refuge with You from disbelief and poverty, and I take refuge with You from the punishment of the grave. None has the right to be worshipped except You.",hisn:82},{title:"Reliance on Allah",n:7,ar:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",tr:"Hasbiyal-laahu laa ilaaha illaa huwa ʿalayhi tawakkaltu wa huwa rabbul ʿarshil ʿadheem",en:"Allah is sufficient for me. None has the right to be worshipped except Him. Upon Him I rely, and He is Lord of the exalted throne.",src:"Ḥiṣn al-Muslim no. 83 · Sunan Abī Dāwūd 5081 · mawqūf from Abū ad-Dardāʾ",note:"",hisn:83},{title:"Asking for wellbeing",n:1,ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ، وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي",tr:"Allaahuma innee asʾalukal ʿaafiyata fid-dunyaa wal aakhirah, Allaahuma innee asʾalukal ʿafwa wal ʿaafiyata fee deenee wa dunyaaya wa ahlee wa maalee, Allaahumastur ʿawraatee wa aamin rawʿaatee, Allaahummah-fadhnee min bayni yadayya wa min khalfee wa ʿan yameenee wa ʿan shimaalee wa min fawqee, wa aʿoodhu bi ʿadhamatika an ughtaala min tahtee",en:"O Allah, I ask You for pardon and well-being in this life and the next. O Allah, I ask You for pardon and well-being in my religious and worldly affairs, and my family and my wealth. O Allah, veil my weaknesses and set at ease my dismay. O Allah, preserve me from the front and from behind and on my right and on my left and from above, and I take refuge with You lest I be swallowed up by the earth.",src:"Ḥiṣn al-Muslim no. 84 · Sunan Abī Dāwūd 5074",note:"",hisn:84},{title:"Refuge from the self",n:1,ar:"اللَّهُمَّ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَشَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",tr:"Allaahumma faatiras-samaawaati wal ard, ʿaalimal ghaybi wash-shahaadah, rabba kulli shayʾin wa maleekah, ash-hadu allaa ilaaha illa ant, aʿoodhu bika min sharri nafsee wa sharrish-shaytaani wa shirkih, wa an aqtarifa ʿalaa nafsee sooʾan aw ajurrahu ilaa muslim",en:"O Allah, Knower of the unseen and the seen, Creator of the heavens and the earth, Lord and Sovereign of all things, I bear witness that none has the right to be worshipped except You. I take refuge in You from the evil of my soul and from the evil and shirk of the devil, and from committing wrong against my soul or bringing such upon another Muslim.",src:"Ḥiṣn al-Muslim no. 85 · Sunan Abī Dāwūd 5067 · addition in at-Tirmidhī 3529",note:"",hisn:85},{title:"In the Name of Allah",n:3,ar:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",tr:"Bismillaahil-ladhee laa yadurru maʿa ismihi shayʾun fil-ardi wa laa fis-samaaʾi wa huwas-samee'ul-ʿaleem",en:"In the name of Allah, with whose name nothing is harmed on earth nor in the heavens, and He is the All-Hearing, the All-Knowing.",src:"Ḥiṣn al-Muslim no. 86 · Musnad Aḥmad 446 · Sunan at-Tirmidhī 3388",note:"",hisn:86},{title:"Contentment",n:3,ar:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا",tr:"Radeetu billaahi rabban, wa bil islaami deenan, wa bi Muhammadin sallal-laahu ʿalayhi wa sallama nabiyyan",en:"I am pleased with Allah as a Lord, and Islam as a religion, and Muhammad ﷺ as a Prophet.",src:"Ḥiṣn al-Muslim no. 87 · Musnad Aḥmad 18968",note:"",hisn:87},{title:"Seeking help",n:1,ar:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",tr:"Yaa hayyu yaa qayyoom, bi rahmatika astagheeth, aslih lee shaʾnee kullahu wa laa takilnee ilaa nafsee tarfata ʿayn",en:"O Ever-Living, O Self-Subsisting and Supporter of all, by Your mercy I seek assistance. Rectify for me all of my affairs and do not leave me to myself, even for the blink of an eye.",src:"Ḥiṣn al-Muslim no. 88 · Sunan an-Nasāʾī (al-Kubrā) 10405",note:"",hisn:88},{title:"The good of this day",n:1,src:"Ḥiṣn al-Muslim no. 89 · Abū Dāwūd",note:"",m:{ar:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ: فَتْحَهُ، وَنَصْرَهُ، وَنُورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ",tr:"Asbahnaa wa asbahal-mulku lillaahi rabbil-ʿaalameen. Allaahumma innee asʾaluka khayra haadhal-yawm: fathahu, wa nasrahu, wa noorahu, wa barakatahu, wa hudaahu, wa aʿoodhu bika min sharri maa feehi wa sharri maa baʿdah",en:"We have reached the morning and at this very time all sovereignty belongs to Allah, Lord of the worlds. O Allah, I ask You for the good of this day, its triumphs and its victories, its light and its blessings and its guidance, and I take refuge in You from the evil of this day and the evil that follows it."},e:{ar:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ: فَتْحَهَا، وَنَصْرَهَا، وَنُورَهَا، وَبَرَكَتَهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهَا وَشَرِّ مَا بَعْدَهَا",tr:"Amsaynaa wa amsal-mulku lillaahi rabbil-ʿaalameen. Allaahumma innee asʾaluka khayra haadhihil-laylah: fathahaa, wa nasrahaa, wa noorahaa, wa barakatahaa, wa hudaahaa, wa aʿoodhu bika min sharri maa feehaa wa sharri maa baʿdahaa",en:"We have reached the evening and at this very time all sovereignty belongs to Allah, Lord of the worlds. O Allah, I ask You for the good of tonight, its triumphs and its victories, its light and its blessings and its guidance, and I take refuge in You from the evil of tonight and the evil that follows it."},hisn:89},{title:"Upon the fiṭrah of Islam",n:1,src:"Ḥiṣn al-Muslim no. 90 · Aḥmad",note:"",m:{ar:"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ",tr:"Asbahnaa ʿalaa fitratil islaam, wa ʿalaa kalimatil ikhlaas, wa ʿalaa deeni nabiyyinaa Muhammadin sallal-laahu ʿalayhi wa sallam, wa ʿalaa millati abeenaa Ibraaheema haneefan musliman wa maa kaana minal mushrikeen",en:"We rise upon the fitrah of Islam, and the word of pure faith, and upon the religion of our Prophet Muhammad ﷺ and the religion of our forefather Ibrāhīm, who was a Muslim and of true faith and was not of those who associate others with Allah."},e:{ar:"أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ",tr:"Amsaynaa ʿalaa fitratil islaam, wa ʿalaa kalimatil ikhlaas, wa ʿalaa deeni nabiyyinaa Muhammadin sallal-laahu ʿalayhi wa sallam, wa ʿalaa millati abeenaa Ibraaheema haneefan musliman wa maa kaana minal mushrikeen",en:"We have reached the evening upon the fitrah of Islam, and the word of pure faith, and upon the religion of our Prophet Muhammad ﷺ and the religion of our forefather Ibrāhīm, who was a Muslim and of true faith and was not of those who associate others with Allah."},hisn:90},{title:"Tasbīḥ",n:100,ar:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",tr:"Subhaanallaahi wa bi hamdihi",en:"How perfect Allah is, and I praise Him.",src:"Ḥiṣn al-Muslim no. 91 · Ṣaḥīḥ al-Bukhārī 6405 · Ṣaḥīḥ Muslim 2691",note:"",hisn:91},{title:"Tahlīl",n:10,ar:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",tr:"Laa ilaaha illal-laahu wahdahu laa shareeka lahu, lahul mulku wa lahul hamdu wa huwa ʿala kulli shayʾin qadeer",en:"None has the right to be worshipped except Allah, alone, without partner. To Him belongs all sovereignty and praise, and He is over all things omnipotent.",src:"Ḥiṣn al-Muslim no. 92 · Ṣaḥīḥ al-Bukhārī 3293 · Ṣaḥīḥ Muslim 2691",note:"Ḥiṣn al-Muslim also teaches saying it one hundred times every day (no. 93).",hisn:92},{title:"Praise beyond measure",n:3,ar:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ",tr:"Subhaanallaahi wa bi hamdihi, ʿadada khalqihi, wa ridaa nafsihi, wa zinata ʿarshihi, wa midaada kalimaatih",en:"How perfect Allah is and I praise Him, by the number of His creation and His pleasure, and by the weight of His throne and the ink of His words.",src:"Ḥiṣn al-Muslim no. 94 · Ṣaḥīḥ Muslim 2726",note:"",hisn:94},{title:"Beneficial knowledge",n:1,src:"Ḥiṣn al-Muslim no. 95 · Ibn Mājah",only:"m",note:"Said after the salām of the Fajr prayer.",ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا",tr:"Allaahumma innee asʾaluka ʿilman naafiʿan, wa rizqan tayyiban, wa ʿamalan mutaqabbalan",en:"O Allah, I ask You for knowledge which is beneficial, sustenance which is good, and deeds which are acceptable.",hisn:95},{title:"Istighfār",n:100,src:"Ḥiṣn al-Muslim no. 96 · Al-Bukhārī, Muslim",note:"The Prophet ﷺ sought forgiveness one hundred times a day.",ar:"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",tr:"Astaghfirullaaha wa atoobu ilayh",en:"I seek Allah’s forgiveness and repent unto Him.",hisn:96},{title:"The perfect words of Allah",n:3,ar:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",tr:"Aʿoodhu bi kalimaatil-laahit-taammaati min sharri maa khalaq",en:"I take refuge in Allah’s perfect words from the evil He has created.",src:"Ḥiṣn al-Muslim no. 97 · Ṣaḥīḥ Muslim 2708, 2709",note:"Three times in the evening.",only:"e",hisn:97},{title:"Ṣalawāt on the Prophet ﷺ",n:10,src:"Ḥiṣn al-Muslim no. 98 · Aṭ-Ṭabarānī",note:"",ar:"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",tr:"Allaahumma salli wa sallim ʿalaa nabiyyinaa Muhammad",en:"O Allah, send prayers and blessings upon our Prophet Muhammad.",hisn:98}],stations:[{ar:"الْمُشَارَطَة",tr:"Mushāraṭah",t:"Agreeing on Conditions",when:"Every morning after Fajr",sum:"Agreeing on conditions with the soul. Each morning, state your terms upon it and name what you will guard against. “My only capital is my lifetime.”",q:"Have I upheld the conditions I set out today?"},{ar:"الْمُرَاقَبَة",tr:"Murāqabah",t:"Vigilance",when:"Throughout the day",sum:"Watching the soul in every state throughout the day.",q:"Have I been watchful of Allah in every state today, in private and in public?"},{ar:"الْمُحَاسَبَة",tr:"Muḥāsabah",t:"Self-Examination",when:"At the end of every day",sum:"Examining the soul. Hold it to account for the day: what it fulfilled, what it added, and where it fell short.",q:"Have I examined my soul today and held it to account?"},{ar:"الْمُعَاتَبَة",tr:"Muʿātabah",t:"Self-Censure",when:"When it falls short",sum:"Speaking to the soul, questioning its intentions, and expressing severe disapproval of its failings.",q:"Have I spoken to my soul today and named its failings?"},{ar:"الْمُعَاقَبَة",tr:"Muʿāqabah",t:"Consequences",when:"When it falls short",sum:"Making the soul pay a real price for its shortcomings.",q:"When I fell short today, have I made my soul pay for it?"},{ar:"الْمُجَاهَدَة",tr:"Mujāhadah",t:"Striving Against the Nafs",when:"When it resists",sum:"Forcing the soul forward when it resists, and refusing to negotiate with it.",q:"When my soul resisted today, did I force it forward instead of negotiating with it?"}],check:[{id:"fajrS",t:"Fajr Sunnah",s:"2 rakʿāt before Fajr",link:null},{id:"fajr",t:"Fajr in the masjid",s:"Compulsory",link:null},{id:"maghribS",t:"Maghrib Sunnah",s:"2 rakʿāt after",link:null},{id:"ishaS",t:"ʿIshāʾ Sunnah",s:"2 rakʿāt after",link:null},{id:"witr",t:"Witr",s:"",link:null},{id:"quran",t:"Qurʾān wird",s:"5 pages",link:null},{id:"yasin",t:"Sūrat Yāsīn",s:"",link:null},{id:"mulk",t:"Sūrat al-Mulk",s:"Before sleep",link:null},{id:"reflect",t:"Verse reflection",s:"Today’s verse from Sūrat Hūd",link:"reflect"},{id:"istighfar",t:"100 Istighfār",s:"Astaghfirullāha wa atūbu ilayh",link:null},{id:"am",t:"Morning adhkār",s:"Tap Open to do them here",link:"morning"},{id:"pm",t:"Evening adhkār",s:"Tap Open to do them here",link:"evening"},{id:"nosleep",t:"No sleep after Fajr",s:"Stay up until sunrise",link:null},{id:"rcard",t:"The Rabbānī Card",s:"Read this week’s card and reflect on it",link:"rcards"}],vr:{surah:11,name:"Hūd",start:55,startDate:"2026-10-09",last:123,verses:{54:{ar:"إِن نَّقُولُ إِلَّا ٱعۡتَرَىٰكَ بَعۡضُ ءَالِهَتِنَا بِسُوٓءٖۗ قَالَ إِنِّيٓ أُشۡهِدُ ٱللَّهَ وَٱشۡهَدُوٓاْ أَنِّي بَرِيٓءٞ مِّمَّا تُشۡرِكُونَ",en:'We only say that some of our gods have possessed you with evil." He said, "Indeed, I call Allah to witness, and witness [yourselves] that I am free from whatever you associate with Allah',tr:"In naqoolu illa iAAtaraka baAAdu alihatina bisooin qala innee oshhidu Allaha waishhadoo annee bareeon mimma tushrikoona"},55:{ar:"مِن دُونِهِۦۖ فَكِيدُونِي جَمِيعٗا ثُمَّ لَا تُنظِرُونِ",en:"Other than Him. So plot against me all together; then do not give me respite",tr:"Min doonihi fakeedoonee jameeAAan thumma la tunthirooni"},56:{ar:"إِنِّي تَوَكَّلۡتُ عَلَى ٱللَّهِ رَبِّي وَرَبِّكُمۚ مَّا مِن دَآبَّةٍ إِلَّا هُوَ ءَاخِذُۢ بِنَاصِيَتِهَآۚ إِنَّ رَبِّي عَلَىٰ صِرَٰطٖ مُّسۡتَقِيمٖ",en:"Indeed, I have relied upon Allah, my Lord and your Lord. There is no creature but that He holds its forelock. Indeed, my Lord is on a path [that is] straight",tr:"Innee tawakkaltu AAala Allahi rabbee warabbikum ma min dabbatin illa huwa akhithun binasiyatiha inna rabbee AAala siratin mustaqeemin"},57:{ar:"فَإِن تَوَلَّوۡاْ فَقَدۡ أَبۡلَغۡتُكُم مَّآ أُرۡسِلۡتُ بِهِۦٓ إِلَيۡكُمۡۚ وَيَسۡتَخۡلِفُ رَبِّي قَوۡمًا غَيۡرَكُمۡ وَلَا تَضُرُّونَهُۥ شَيۡـًٔاۚ إِنَّ رَبِّي عَلَىٰ كُلِّ شَيۡءٍ حَفِيظٞ",en:'But if they turn away, [say], "I have already conveyed that with which I was sent to you. My Lord will give succession to a people other than you, and you will not harm Him at all. Indeed my Lord is, over all things, Guardian',tr:"Fain tawallaw faqad ablaghtukum ma orsiltu bihi ilaykum wayastakhlifu rabbee qawman ghayrakum wala tadurroonahu shayan inna rabbee AAala kulli shayin hafeethun"},58:{ar:"وَلَمَّا جَآءَ أَمۡرُنَا نَجَّيۡنَا هُودٗا وَٱلَّذِينَ ءَامَنُواْ مَعَهُۥ بِرَحۡمَةٖ مِّنَّا وَنَجَّيۡنَٰهُم مِّنۡ عَذَابٍ غَلِيظٖ",en:"And when Our command came, We saved Hud and those who believed with him, by mercy from Us; and We saved them from a harsh punishment",tr:"Walamma jaa amruna najjayna hoodan waallatheena amanoo maAAahu birahmatin minna wanajjaynahum min AAathabin ghaleethin"},59:{ar:"وَتِلۡكَ عَادٞۖ جَحَدُواْ بِـَٔايَٰتِ رَبِّهِمۡ وَعَصَوۡاْ رُسُلَهُۥ وَٱتَّبَعُوٓاْ أَمۡرَ كُلِّ جَبَّارٍ عَنِيدٖ",en:"And that was 'Aad, who rejected the signs of their Lord and disobeyed His messengers and followed the order of every obstinate tyrant",tr:"Watilka AAadun jahadoo biayati rabbihim waAAasaw rusulahu waittabaAAoo amra kulli jabbarin AAaneedin"},60:{ar:"وَأُتۡبِعُواْ فِي هَٰذِهِ ٱلدُّنۡيَا لَعۡنَةٗ وَيَوۡمَ ٱلۡقِيَٰمَةِۗ أَلَآ إِنَّ عَادٗا كَفَرُواْ رَبَّهُمۡۗ أَلَا بُعۡدٗا لِّعَادٖ قَوۡمِ هُودٖ",en:"And they were [therefore] followed in this world with a curse and [as well] on the Day of Resurrection. Unquestionably, 'Aad denied their Lord; then away with 'Aad, the people of Hud",tr:"WaotbiAAoo fee hathihi alddunya laAAnatan wayawma alqiyamati ala inna AAadan kafaroo rabbahum ala buAAdan liAAadin qawmi hoodin"},61:{ar:"۞وَإِلَىٰ ثَمُودَ أَخَاهُمۡ صَٰلِحٗاۚ قَالَ يَٰقَوۡمِ ٱعۡبُدُواْ ٱللَّهَ مَا لَكُم مِّنۡ إِلَٰهٍ غَيۡرُهُۥۖ هُوَ أَنشَأَكُم مِّنَ ٱلۡأَرۡضِ وَٱسۡتَعۡمَرَكُمۡ فِيهَا فَٱسۡتَغۡفِرُوهُ ثُمَّ تُوبُوٓاْ إِلَيۡهِۚ إِنَّ رَبِّي قَرِيبٞ مُّجِيبٞ",en:'And to Thamud [We sent] their brother Salih. He said, "O my people, worship Allah; you have no deity other than Him. He has produced you from the earth and settled you in it, so ask forgiveness of Him and then repent to Him. Indeed, my Lord is near and responsive',tr:"Waila thamooda akhahum salihan qala ya qawmi oAAbudoo Allaha ma lakum min ilahin ghayruhu huwa anshaakum mina alardi waistaAAmarakum feeha faistaghfiroohu thumma tooboo ilayhi inna rabbee qareebun mujeebun"},62:{ar:"قَالُواْ يَٰصَٰلِحُ قَدۡ كُنتَ فِينَا مَرۡجُوّٗا قَبۡلَ هَٰذَآۖ أَتَنۡهَىٰنَآ أَن نَّعۡبُدَ مَا يَعۡبُدُ ءَابَآؤُنَا وَإِنَّنَا لَفِي شَكّٖ مِّمَّا تَدۡعُونَآ إِلَيۡهِ مُرِيبٖ",en:'They said, "O Salih, you were among us a man of promise before this. Do you forbid us to worship what our fathers worshipped? And indeed we are, about that to which you invite us, in disquieting doubt',tr:"Qaloo ya salihu qad kunta feena marjuwwan qabla hatha atanhana an naAAbuda ma yaAAbudu abaona wainnana lafee shakkin mimma tadAAoona ilayhi mureebun"},63:{ar:"قَالَ يَٰقَوۡمِ أَرَءَيۡتُمۡ إِن كُنتُ عَلَىٰ بَيِّنَةٖ مِّن رَّبِّي وَءَاتَىٰنِي مِنۡهُ رَحۡمَةٗ فَمَن يَنصُرُنِي مِنَ ٱللَّهِ إِنۡ عَصَيۡتُهُۥۖ فَمَا تَزِيدُونَنِي غَيۡرَ تَخۡسِيرٖ",en:'He said, "O my people, have you considered: if I should be upon clear evidence from my Lord and He has given me mercy from Himself, who would protect me from Allah if I disobeyed Him? So you would not increase me except in loss',tr:"Qala ya qawmi araaytum in kuntu AAala bayyinatin min rabbee waatanee minhu rahmatan faman yansurunee mina Allahi in AAasaytuhu fama tazeedoonanee ghayra takhseerin"},64:{ar:"وَيَٰقَوۡمِ هَٰذِهِۦ نَاقَةُ ٱللَّهِ لَكُمۡ ءَايَةٗۖ فَذَرُوهَا تَأۡكُلۡ فِيٓ أَرۡضِ ٱللَّهِۖ وَلَا تَمَسُّوهَا بِسُوٓءٖ فَيَأۡخُذَكُمۡ عَذَابٞ قَرِيبٞ",en:"And O my people, this is the she-camel of Allah - [she is] to you a sign. So let her feed upon Allah 's earth and do not touch her with harm, or you will be taken by an impending punishment",tr:"Waya qawmi hathihi naqatu Allahi lakum ayatan fatharooha takul fee ardi Allahi wala tamassooha bisooin fayakhuthakum AAathabun qareebun"},65:{ar:"فَعَقَرُوهَا فَقَالَ تَمَتَّعُواْ فِي دَارِكُمۡ ثَلَٰثَةَ أَيَّامٖۖ ذَٰلِكَ وَعۡدٌ غَيۡرُ مَكۡذُوبٖ",en:'But they hamstrung her, so he said, "Enjoy yourselves in your homes for three days. That is a promise not to be denied',tr:"FaAAaqarooha faqala tamattaAAoo fee darikum thalathata ayyamin thalika waAAdun ghayru makthoobin"},66:{ar:"فَلَمَّا جَآءَ أَمۡرُنَا نَجَّيۡنَا صَٰلِحٗا وَٱلَّذِينَ ءَامَنُواْ مَعَهُۥ بِرَحۡمَةٖ مِّنَّا وَمِنۡ خِزۡيِ يَوۡمِئِذٍۚ إِنَّ رَبَّكَ هُوَ ٱلۡقَوِيُّ ٱلۡعَزِيزُ",en:"So when Our command came, We saved Salih and those who believed with him, by mercy from Us, and [saved them] from the disgrace of that day. Indeed, it is your Lord who is the Powerful, the Exalted in Might",tr:"Falamma jaa amruna najjayna salihan waallatheena amanoo maAAahu birahmatin minna wamin khizyi yawmiithin inna rabbaka huwa alqawiyyu alAAazeezu"},67:{ar:"وَأَخَذَ ٱلَّذِينَ ظَلَمُواْ ٱلصَّيۡحَةُ فَأَصۡبَحُواْ فِي دِيَٰرِهِمۡ جَٰثِمِينَ",en:"And the shriek seized those who had wronged, and they became within their homes [corpses] fallen prone",tr:"Waakhatha allatheena thalamoo alssayhatu faasbahoo fee diyarihim jathimeena"},68:{ar:"كَأَن لَّمۡ يَغۡنَوۡاْ فِيهَآۗ أَلَآ إِنَّ ثَمُودَاْ كَفَرُواْ رَبَّهُمۡۗ أَلَا بُعۡدٗا لِّثَمُودَ",en:"As if they had never prospered therein. Unquestionably, Thamud denied their Lord; then, away with Thamud",tr:"Kaan lam yaghnaw feeha ala inna thamooda kafaroo rabbahum ala buAAdan lithamooda"},69:{ar:"وَلَقَدۡ جَآءَتۡ رُسُلُنَآ إِبۡرَٰهِيمَ بِٱلۡبُشۡرَىٰ قَالُواْ سَلَٰمٗاۖ قَالَ سَلَٰمٞۖ فَمَا لَبِثَ أَن جَآءَ بِعِجۡلٍ حَنِيذٖ",en:'And certainly did Our messengers come to Abraham with good tidings; they said, "Peace." He said, "Peace," and did not delay in bringing [them] a roasted calf',tr:"Walaqad jaat rusuluna ibraheema bialbushra qaloo salaman qala salamun fama labitha an jaa biAAijlin haneethin"},70:{ar:"فَلَمَّا رَءَآ أَيۡدِيَهُمۡ لَا تَصِلُ إِلَيۡهِ نَكِرَهُمۡ وَأَوۡجَسَ مِنۡهُمۡ خِيفَةٗۚ قَالُواْ لَا تَخَفۡ إِنَّآ أُرۡسِلۡنَآ إِلَىٰ قَوۡمِ لُوطٖ",en:'But when he saw their hands not reaching for it, he distrusted them and felt from them apprehension. They said, "Fear not. We have been sent to the people of Lot',tr:"Falamma raa aydiyahum la tasilu ilayhi nakirahum waawjasa minhum kheefatan qaloo la takhaf inna orsilna ila qawmi lootin"},71:{ar:"وَٱمۡرَأَتُهُۥ قَآئِمَةٞ فَضَحِكَتۡ فَبَشَّرۡنَٰهَا بِإِسۡحَٰقَ وَمِن وَرَآءِ إِسۡحَٰقَ يَعۡقُوبَ",en:"And his Wife was standing, and she smiled. Then We gave her good tidings of Isaac and after Isaac, Jacob",tr:"Waimraatuhu qaimatun fadahikat fabashsharnaha biishaqa wamin warai ishaqa yaAAqooba"},72:{ar:"قَالَتۡ يَٰوَيۡلَتَىٰٓ ءَأَلِدُ وَأَنَا۠ عَجُوزٞ وَهَٰذَا بَعۡلِي شَيۡخًاۖ إِنَّ هَٰذَا لَشَيۡءٌ عَجِيبٞ",en:'She said, "Woe to me! Shall I give birth while I am an old woman and this, my husband, is an old man? Indeed, this is an amazing thing',tr:"Qalat ya waylata aalidu waana AAajoozun wahatha baAAlee shaykhan inna hatha lashayon AAajeebun"},73:{ar:"قَالُوٓاْ أَتَعۡجَبِينَ مِنۡ أَمۡرِ ٱللَّهِۖ رَحۡمَتُ ٱللَّهِ وَبَرَكَٰتُهُۥ عَلَيۡكُمۡ أَهۡلَ ٱلۡبَيۡتِۚ إِنَّهُۥ حَمِيدٞ مَّجِيدٞ",en:'They said, "Are you amazed at the decree of Allah? May the mercy of Allah and His blessings be upon you, people of the house. Indeed, He is Praiseworthy and Honorable',tr:"Qaloo ataAAjabeena min amri Allahi rahmatu Allahi wabarakatuhu AAalaykum ahla albayti innahu hameedun majeedun"},74:{ar:"فَلَمَّا ذَهَبَ عَنۡ إِبۡرَٰهِيمَ ٱلرَّوۡعُ وَجَآءَتۡهُ ٱلۡبُشۡرَىٰ يُجَٰدِلُنَا فِي قَوۡمِ لُوطٍ",en:"And when the fright had left Abraham and the good tidings had reached him, he began to argue with Us concerning the people of Lot",tr:"Falamma thahaba AAan ibraheema alrrawAAu wajaathu albushra yujadiluna fee qawmi lootin"},75:{ar:"إِنَّ إِبۡرَٰهِيمَ لَحَلِيمٌ أَوَّـٰهٞ مُّنِيبٞ",en:"Indeed, Abraham was forbearing, grieving and [frequently] returning [to Allah]",tr:"Inna ibraheema lahaleemun awwahun muneebun"},76:{ar:"يَـٰٓإِبۡرَٰهِيمُ أَعۡرِضۡ عَنۡ هَٰذَآۖ إِنَّهُۥ قَدۡ جَآءَ أَمۡرُ رَبِّكَۖ وَإِنَّهُمۡ ءَاتِيهِمۡ عَذَابٌ غَيۡرُ مَرۡدُودٖ",en:'[The angels said], "O Abraham, give up this [plea]. Indeed, the command of your Lord has come, and indeed, there will reach them a punishment that cannot be repelled',tr:"Ya ibraheemu aAArid AAan hatha innahu qad jaa amru rabbika wainnahum ateehim AAathabun ghayru mardoodin"},77:{ar:"وَلَمَّا جَآءَتۡ رُسُلُنَا لُوطٗا سِيٓءَ بِهِمۡ وَضَاقَ بِهِمۡ ذَرۡعٗا وَقَالَ هَٰذَا يَوۡمٌ عَصِيبٞ",en:'And when Our messengers, [the angels], came to Lot, he was anguished for them and felt for them great discomfort and said, "This is a trying day',tr:"Walamma jaat rusuluna lootan seea bihim wadaqa bihim tharAAan waqala hatha yawmun AAaseebun"},78:{ar:"وَجَآءَهُۥ قَوۡمُهُۥ يُهۡرَعُونَ إِلَيۡهِ وَمِن قَبۡلُ كَانُواْ يَعۡمَلُونَ ٱلسَّيِّـَٔاتِۚ قَالَ يَٰقَوۡمِ هَـٰٓؤُلَآءِ بَنَاتِي هُنَّ أَطۡهَرُ لَكُمۡۖ فَٱتَّقُواْ ٱللَّهَ وَلَا تُخۡزُونِ فِي ضَيۡفِيٓۖ أَلَيۡسَ مِنكُمۡ رَجُلٞ رَّشِيدٞ",en:'And his people came hastening to him, and before [this] they had been doing evil deeds. He said, "O my people, these are my daughters; they are purer for you. So fear Allah and do not disgrace me concerning my guests. Is there not among you a man of reason',tr:"Wajaahu qawmuhu yuhraAAoona ilayhi wamin qablu kanoo yaAAmaloona alssayyiati qala ya qawmi haolai banatee hunna atharu lakum faittaqoo Allaha wala tukhzooni fee dayfee alaysa minkum rajulun rasheedun"},79:{ar:"قَالُواْ لَقَدۡ عَلِمۡتَ مَا لَنَا فِي بَنَاتِكَ مِنۡ حَقّٖ وَإِنَّكَ لَتَعۡلَمُ مَا نُرِيدُ",en:'They said, "You have already known that we have not concerning your daughters any claim, and indeed, you know what we want',tr:"Qaloo laqad AAalimta ma lana fee banatika min haqqin wainnaka lataAAlamu ma nureedu"},80:{ar:"قَالَ لَوۡ أَنَّ لِي بِكُمۡ قُوَّةً أَوۡ ءَاوِيٓ إِلَىٰ رُكۡنٖ شَدِيدٖ",en:'He said, "If only I had against you some power or could take refuge in a strong support',tr:"Qala law anna lee bikum quwwatan aw awee ila ruknin shadeedin"},81:{ar:"قَالُواْ يَٰلُوطُ إِنَّا رُسُلُ رَبِّكَ لَن يَصِلُوٓاْ إِلَيۡكَۖ فَأَسۡرِ بِأَهۡلِكَ بِقِطۡعٖ مِّنَ ٱلَّيۡلِ وَلَا يَلۡتَفِتۡ مِنكُمۡ أَحَدٌ إِلَّا ٱمۡرَأَتَكَۖ إِنَّهُۥ مُصِيبُهَا مَآ أَصَابَهُمۡۚ إِنَّ مَوۡعِدَهُمُ ٱلصُّبۡحُۚ أَلَيۡسَ ٱلصُّبۡحُ بِقَرِيبٖ",en:'The angels said, "O Lot, indeed we are messengers of your Lord; [therefore], they will never reach you. So set out with your family during a portion of the night and let not any among you look back - except your wife; indeed, she will be struck by that which strikes them. Indeed, their appointment is [for] the morning. Is not the morning near',tr:"Qaloo ya lootu inna rusulu rabbika lan yasiloo ilayka faasri biahlika biqitAAin mina allayli wala yaltafit minkum ahadun illa imraataka innahu museebuha ma asabahum inna mawAAidahumu alssubhu alaysa alssubhu biqareebin"},82:{ar:"فَلَمَّا جَآءَ أَمۡرُنَا جَعَلۡنَا عَٰلِيَهَا سَافِلَهَا وَأَمۡطَرۡنَا عَلَيۡهَا حِجَارَةٗ مِّن سِجِّيلٖ مَّنضُودٖ",en:"So when Our command came, We made the highest part [of the city] its lowest and rained upon them stones of layered hard clay, [which were]",tr:"Falamma jaa amruna jaAAalna AAaliyaha safilaha waamtarna AAalayha hijaratan min sijjeelin mandoodin"},83:{ar:"مُّسَوَّمَةً عِندَ رَبِّكَۖ وَمَا هِيَ مِنَ ٱلظَّـٰلِمِينَ بِبَعِيدٖ",en:"Marked from your Lord. And Allah 's punishment is not from the wrongdoers [very] far",tr:"Musawwamatan AAinda rabbika wama hiya mina alththalimeena bibaAAeedin"},84:{ar:"۞وَإِلَىٰ مَدۡيَنَ أَخَاهُمۡ شُعَيۡبٗاۚ قَالَ يَٰقَوۡمِ ٱعۡبُدُواْ ٱللَّهَ مَا لَكُم مِّنۡ إِلَٰهٍ غَيۡرُهُۥۖ وَلَا تَنقُصُواْ ٱلۡمِكۡيَالَ وَٱلۡمِيزَانَۖ إِنِّيٓ أَرَىٰكُم بِخَيۡرٖ وَإِنِّيٓ أَخَافُ عَلَيۡكُمۡ عَذَابَ يَوۡمٖ مُّحِيطٖ",en:`And to Madyan [We sent] their brother Shu'ayb. He said, "O my people, worship Allah; you have no deity other than Him. And do not decrease from the measure and the scale. Indeed, I see you in prosperity, but indeed, I fear for you the punishment of an all-encompassing Day`,tr:"Waila madyana akhahum shuAAayban qala ya qawmi oAAbudoo Allaha ma lakum min ilahin ghayruhu wala tanqusoo almikyala waalmeezana innee arakum bikhayrin wainnee akhafu AAalaykum AAathaba yawmin muheetin"},85:{ar:"وَيَٰقَوۡمِ أَوۡفُواْ ٱلۡمِكۡيَالَ وَٱلۡمِيزَانَ بِٱلۡقِسۡطِۖ وَلَا تَبۡخَسُواْ ٱلنَّاسَ أَشۡيَآءَهُمۡ وَلَا تَعۡثَوۡاْ فِي ٱلۡأَرۡضِ مُفۡسِدِينَ",en:"And O my people, give full measure and weight in justice and do not deprive the people of their due and do not commit abuse on the earth, spreading corruption",tr:"Waya qawmi awfoo almikyala waalmeezana bialqisti wala tabkhasoo alnnasa ashyaahum wala taAAthaw fee alardi mufsideena"},86:{ar:"بَقِيَّتُ ٱللَّهِ خَيۡرٞ لَّكُمۡ إِن كُنتُم مُّؤۡمِنِينَۚ وَمَآ أَنَا۠ عَلَيۡكُم بِحَفِيظٖ",en:"What remains [lawful] from Allah is best for you, if you would be believers. But I am not a guardian over you",tr:"Baqiyyatu Allahi khayrun lakum in kuntum mumineena wama ana AAalaykum bihafeethin"},87:{ar:"قَالُواْ يَٰشُعَيۡبُ أَصَلَوٰتُكَ تَأۡمُرُكَ أَن نَّتۡرُكَ مَا يَعۡبُدُ ءَابَآؤُنَآ أَوۡ أَن نَّفۡعَلَ فِيٓ أَمۡوَٰلِنَا مَا نَشَـٰٓؤُاْۖ إِنَّكَ لَأَنتَ ٱلۡحَلِيمُ ٱلرَّشِيدُ",en:`They said, "O Shu'ayb, does your prayer command you that we should leave what our fathers worship or not do with our wealth what we please? Indeed, you are the forbearing, the discerning`,tr:"Qaloo ya shuAAaybu asalatuka tamuruka an natruka ma yaAAbudu abaona aw an nafAAala fee amwalina ma nashao innaka laanta alhaleemu alrrasheedu"},88:{ar:"قَالَ يَٰقَوۡمِ أَرَءَيۡتُمۡ إِن كُنتُ عَلَىٰ بَيِّنَةٖ مِّن رَّبِّي وَرَزَقَنِي مِنۡهُ رِزۡقًا حَسَنٗاۚ وَمَآ أُرِيدُ أَنۡ أُخَالِفَكُمۡ إِلَىٰ مَآ أَنۡهَىٰكُمۡ عَنۡهُۚ إِنۡ أُرِيدُ إِلَّا ٱلۡإِصۡلَٰحَ مَا ٱسۡتَطَعۡتُۚ وَمَا تَوۡفِيقِيٓ إِلَّا بِٱللَّهِۚ عَلَيۡهِ تَوَكَّلۡتُ وَإِلَيۡهِ أُنِيبُ",en:'He said, "O my people, have you considered: if I am upon clear evidence from my Lord and He has provided me with a good provision from Him...? And I do not intend to differ from you in that which I have forbidden you; I only intend reform as much as I am able. And my success is not but through Allah. Upon him I have relied, and to Him I return',tr:"Qala ya qawmi araaytum in kuntu AAala bayyinatin min rabbee warazaqanee minhu rizqan hasanan wama oreedu an okhalifakum ila ma anhakum AAanhu in oreedu illa alislaha ma istataAAtu wama tawfeeqee illa biAllahi AAalayhi tawakkaltu wailayhi oneebu"},89:{ar:"وَيَٰقَوۡمِ لَا يَجۡرِمَنَّكُمۡ شِقَاقِيٓ أَن يُصِيبَكُم مِّثۡلُ مَآ أَصَابَ قَوۡمَ نُوحٍ أَوۡ قَوۡمَ هُودٍ أَوۡ قَوۡمَ صَٰلِحٖۚ وَمَا قَوۡمُ لُوطٖ مِّنكُم بِبَعِيدٖ",en:"And O my people, let not [your] dissension from me cause you to be struck by that similar to what struck the people of Noah or the people of Hud or the people of Salih. And the people of Lot are not from you far away",tr:"Waya qawmi la yajrimannakum shiqaqee an yuseebakum mithlu ma asaba qawma noohin aw qawma hoodin aw qawma salihin wama qawmu lootin minkum bibaAAeedin"},90:{ar:"وَٱسۡتَغۡفِرُواْ رَبَّكُمۡ ثُمَّ تُوبُوٓاْ إِلَيۡهِۚ إِنَّ رَبِّي رَحِيمٞ وَدُودٞ",en:"And ask forgiveness of your Lord and then repent to Him. Indeed, my Lord is Merciful and Affectionate",tr:"Waistaghfiroo rabbakum thumma tooboo ilayhi inna rabbee raheemun wadoodun"},91:{ar:"قَالُواْ يَٰشُعَيۡبُ مَا نَفۡقَهُ كَثِيرٗا مِّمَّا تَقُولُ وَإِنَّا لَنَرَىٰكَ فِينَا ضَعِيفٗاۖ وَلَوۡلَا رَهۡطُكَ لَرَجَمۡنَٰكَۖ وَمَآ أَنتَ عَلَيۡنَا بِعَزِيزٖ",en:`They said, "O Shu'ayb, we do not understand much of what you say, and indeed, we consider you among us as weak. And if not for your family, we would have stoned you [to death]; and you are not to us one respected`,tr:"Qaloo ya shuAAaybu ma nafqahu katheeran mimma taqoolu wainna lanaraka feena daAAeefan walawla rahtuka larajamnaka wama anta AAalayna biAAazeezin"},92:{ar:"قَالَ يَٰقَوۡمِ أَرَهۡطِيٓ أَعَزُّ عَلَيۡكُم مِّنَ ٱللَّهِ وَٱتَّخَذۡتُمُوهُ وَرَآءَكُمۡ ظِهۡرِيًّاۖ إِنَّ رَبِّي بِمَا تَعۡمَلُونَ مُحِيطٞ",en:'He said, "O my people, is my family more respected for power by you than Allah? But you put Him behind your backs [in neglect]. Indeed, my Lord is encompassing of what you do',tr:"Qala ya qawmi arahtee aAAazzu AAalaykum mina Allahi waittakhathtumoohu waraakum thihriyyan inna rabbee bima taAAmaloona muheetun"},93:{ar:"وَيَٰقَوۡمِ ٱعۡمَلُواْ عَلَىٰ مَكَانَتِكُمۡ إِنِّي عَٰمِلٞۖ سَوۡفَ تَعۡلَمُونَ مَن يَأۡتِيهِ عَذَابٞ يُخۡزِيهِ وَمَنۡ هُوَ كَٰذِبٞۖ وَٱرۡتَقِبُوٓاْ إِنِّي مَعَكُمۡ رَقِيبٞ",en:"And O my people, work according to your position; indeed, I am working. You are going to know to whom will come a punishment that will disgrace him and who is a liar. So watch; indeed, I am with you a watcher, [awaiting the outcome]",tr:"Waya qawmi iAAmaloo AAala makanatikum innee AAamilun sawfa taAAlamoona man yateehi AAathabun yukhzeehi waman huwa kathibun wairtaqiboo inne maAAakum raqeebun"},94:{ar:"وَلَمَّا جَآءَ أَمۡرُنَا نَجَّيۡنَا شُعَيۡبٗا وَٱلَّذِينَ ءَامَنُواْ مَعَهُۥ بِرَحۡمَةٖ مِّنَّا وَأَخَذَتِ ٱلَّذِينَ ظَلَمُواْ ٱلصَّيۡحَةُ فَأَصۡبَحُواْ فِي دِيَٰرِهِمۡ جَٰثِمِينَ",en:"And when Our command came, We saved Shu'ayb and those who believed with him, by mercy from Us. And the shriek seized those who had wronged, and they became within their homes [corpses] fallen prone",tr:"Walamma jaa amruna najjayna shuAAayban waallatheena amanoo maAAahu birahmatin minna waakhathati allatheena thalamoo alssayhatu faasbahoo fee diyarihim jathimeena"},95:{ar:"كَأَن لَّمۡ يَغۡنَوۡاْ فِيهَآۗ أَلَا بُعۡدٗا لِّمَدۡيَنَ كَمَا بَعِدَتۡ ثَمُودُ",en:"As if they had never prospered therein. Then, away with Madyan as Thamud was taken away",tr:"Kaan lam yaghnaw feeha ala buAAdan limadyana kama baAAidat thamoodu"},96:{ar:"وَلَقَدۡ أَرۡسَلۡنَا مُوسَىٰ بِـَٔايَٰتِنَا وَسُلۡطَٰنٖ مُّبِينٍ",en:"And We did certainly send Moses with Our signs and a clear authority",tr:"Walaqad arsalna moosa biayatina wasultanin mubeenin"},97:{ar:"إِلَىٰ فِرۡعَوۡنَ وَمَلَإِيْهِۦ فَٱتَّبَعُوٓاْ أَمۡرَ فِرۡعَوۡنَۖ وَمَآ أَمۡرُ فِرۡعَوۡنَ بِرَشِيدٖ",en:"To Pharaoh and his establishment, but they followed the command of Pharaoh, and the command of Pharaoh was not [at all] discerning",tr:"Ila firAAawna wamalaihi faittabaAAoo amra firAAawna wama amru firAAawna birasheedin"},98:{ar:"يَقۡدُمُ قَوۡمَهُۥ يَوۡمَ ٱلۡقِيَٰمَةِ فَأَوۡرَدَهُمُ ٱلنَّارَۖ وَبِئۡسَ ٱلۡوِرۡدُ ٱلۡمَوۡرُودُ",en:"He will precede his people on the Day of Resurrection and lead them into the Fire; and wretched is the place to which they are led",tr:"Yaqdumu qawmahu yawma alqiyamati faawradahumu alnnara wabisa alwirdu almawroodu"},99:{ar:"وَأُتۡبِعُواْ فِي هَٰذِهِۦ لَعۡنَةٗ وَيَوۡمَ ٱلۡقِيَٰمَةِۚ بِئۡسَ ٱلرِّفۡدُ ٱلۡمَرۡفُودُ",en:"And they were followed in this [world] with a curse and on the Day of Resurrection. And wretched is the gift which is given",tr:"WaotbiAAoo fee hathihi laAAnatan wayawma alqiyamati bisa alrrifdu almarfoodu"},100:{ar:"ذَٰلِكَ مِنۡ أَنۢبَآءِ ٱلۡقُرَىٰ نَقُصُّهُۥ عَلَيۡكَۖ مِنۡهَا قَآئِمٞ وَحَصِيدٞ",en:"That is from the news of the cities, which We relate to you; of them, some are [still] standing and some are [as] a harvest [mowed down]",tr:"Thalika min anbai alqura naqussuhu AAalayka minha qaimun wahaseedun"},101:{ar:"وَمَا ظَلَمۡنَٰهُمۡ وَلَٰكِن ظَلَمُوٓاْ أَنفُسَهُمۡۖ فَمَآ أَغۡنَتۡ عَنۡهُمۡ ءَالِهَتُهُمُ ٱلَّتِي يَدۡعُونَ مِن دُونِ ٱللَّهِ مِن شَيۡءٖ لَّمَّا جَآءَ أَمۡرُ رَبِّكَۖ وَمَا زَادُوهُمۡ غَيۡرَ تَتۡبِيبٖ",en:"And We did not wrong them, but they wronged themselves. And they were not availed at all by their gods which they invoked other than Allah when there came the command of your Lord. And they did not increase them in other than ruin",tr:"Wama thalamnahum walakin thalamoo anfusahum fama aghnat AAanhum alihatuhumu allatee yadAAoona min dooni Allahi min shayin lamma jaa amru rabbika wama zadoohum ghayra tatbeebin"},102:{ar:"وَكَذَٰلِكَ أَخۡذُ رَبِّكَ إِذَآ أَخَذَ ٱلۡقُرَىٰ وَهِيَ ظَٰلِمَةٌۚ إِنَّ أَخۡذَهُۥٓ أَلِيمٞ شَدِيدٌ",en:"And thus is the seizure of your Lord when He seizes the cities while they are committing wrong. Indeed, His seizure is painful and severe",tr:"Wakathalika akhthu rabbika itha akhatha alqura wahiya thalimatun inna akhthahu aleemun shadeedun"},103:{ar:"إِنَّ فِي ذَٰلِكَ لَأٓيَةٗ لِّمَنۡ خَافَ عَذَابَ ٱلۡأٓخِرَةِۚ ذَٰلِكَ يَوۡمٞ مَّجۡمُوعٞ لَّهُ ٱلنَّاسُ وَذَٰلِكَ يَوۡمٞ مَّشۡهُودٞ",en:"Indeed in that is a sign for those who fear the punishment of the Hereafter. That is a Day for which the people will be collected, and that is a Day [which will be] witnessed",tr:"Inna fee thalika laayatan liman khafa AAathaba alakhirati thalika yawmun majmooAAun lahu alnnasu wathalika yawmun mashhoodun"},104:{ar:"وَمَا نُؤَخِّرُهُۥٓ إِلَّا لِأَجَلٖ مَّعۡدُودٖ",en:"And We do not delay it except for a limited term",tr:"Wama nuakhkhiruhu illa liajalin maAAdoodin"},105:{ar:"يَوۡمَ يَأۡتِ لَا تَكَلَّمُ نَفۡسٌ إِلَّا بِإِذۡنِهِۦۚ فَمِنۡهُمۡ شَقِيّٞ وَسَعِيدٞ",en:"The Day it comes no soul will speak except by His permission. And among them will be the wretched and the prosperous",tr:"Yawma yati la takallamu nafsun illa biithnihi faminhum shaqiyyun wasaAAeedin"},106:{ar:"فَأَمَّا ٱلَّذِينَ شَقُواْ فَفِي ٱلنَّارِ لَهُمۡ فِيهَا زَفِيرٞ وَشَهِيقٌ",en:"As for those who were [destined to be] wretched, they will be in the Fire. For them therein is [violent] exhaling and inhaling",tr:"Faamma allatheena shaqoo fafee alnnari lahum feeha zafeerun washaheequn"},107:{ar:"خَٰلِدِينَ فِيهَا مَا دَامَتِ ٱلسَّمَٰوَٰتُ وَٱلۡأَرۡضُ إِلَّا مَا شَآءَ رَبُّكَۚ إِنَّ رَبَّكَ فَعَّالٞ لِّمَا يُرِيدُ",en:"[They will be] abiding therein as long as the heavens and the earth endure, except what your Lord should will. Indeed, your Lord is an effecter of what He intends",tr:"Khalideena feeha ma damati alssamawatu waalardu illa ma shaa rabbuka inna rabbaka faAAAAalun lima yureedu"},108:{ar:"۞وَأَمَّا ٱلَّذِينَ سُعِدُواْ فَفِي ٱلۡجَنَّةِ خَٰلِدِينَ فِيهَا مَا دَامَتِ ٱلسَّمَٰوَٰتُ وَٱلۡأَرۡضُ إِلَّا مَا شَآءَ رَبُّكَۖ عَطَآءً غَيۡرَ مَجۡذُوذٖ",en:"And as for those who were [destined to be] prosperous, they will be in Paradise, abiding therein as long as the heavens and the earth endure, except what your Lord should will - a bestowal uninterrupted",tr:"Waamma allatheena suAAidoo fafee aljannati khalideena feeha ma damati alssamawatu waalardu illa ma shaa rabbuka AAataan ghayra majthoothin"},109:{ar:"فَلَا تَكُ فِي مِرۡيَةٖ مِّمَّا يَعۡبُدُ هَـٰٓؤُلَآءِۚ مَا يَعۡبُدُونَ إِلَّا كَمَا يَعۡبُدُ ءَابَآؤُهُم مِّن قَبۡلُۚ وَإِنَّا لَمُوَفُّوهُمۡ نَصِيبَهُمۡ غَيۡرَ مَنقُوصٖ",en:"So do not be in doubt, [O Muhammad], as to what these [polytheists] are worshipping. They worship not except as their fathers worshipped before. And indeed, We will give them their share undiminished",tr:"Fala taku fee miryatin mimma yaAAbudu haolai ma yaAAbudoona illa kama yaAAbudu abaohum min qablu wainna lamuwaffoohum naseebahum ghayra manqoosin"},110:{ar:"وَلَقَدۡ ءَاتَيۡنَا مُوسَى ٱلۡكِتَٰبَ فَٱخۡتُلِفَ فِيهِۚ وَلَوۡلَا كَلِمَةٞ سَبَقَتۡ مِن رَّبِّكَ لَقُضِيَ بَيۡنَهُمۡۚ وَإِنَّهُمۡ لَفِي شَكّٖ مِّنۡهُ مُرِيبٖ",en:"And We had certainly given Moses the Scripture, but it came under disagreement. And if not for a word that preceded from your Lord, it would have been judged between them. And indeed they are, concerning the Qur'an, in disquieting doubt",tr:"Walaqad atayna moosa alkitaba faikhtulifa feehi walawla kalimatun sabaqat min rabbika laqudiya baynahum wainnahum lafee shakkin minhu mureebun"},111:{ar:"وَإِنَّ كُلّٗا لَّمَّا لَيُوَفِّيَنَّهُمۡ رَبُّكَ أَعۡمَٰلَهُمۡۚ إِنَّهُۥ بِمَا يَعۡمَلُونَ خَبِيرٞ",en:"And indeed, each [of the believers and disbelievers] - your Lord will fully compensate them for their deeds. Indeed, He is Acquainted with what they do",tr:"Wainna kullan lamma layuwaffiyannahum rabbuka aAAmalahum innahu bima yaAAmaloona khabeerun"},112:{ar:"فَٱسۡتَقِمۡ كَمَآ أُمِرۡتَ وَمَن تَابَ مَعَكَ وَلَا تَطۡغَوۡاْۚ إِنَّهُۥ بِمَا تَعۡمَلُونَ بَصِيرٞ",en:"So remain on a right course as you have been commanded, [you] and those who have turned back with you [to Allah], and do not transgress. Indeed, He is Seeing of what you do",tr:"Faistaqim kama omirta waman taba maAAaka wala tatghaw innahu bima taAAmaloona baseerun"},113:{ar:"وَلَا تَرۡكَنُوٓاْ إِلَى ٱلَّذِينَ ظَلَمُواْ فَتَمَسَّكُمُ ٱلنَّارُ وَمَا لَكُم مِّن دُونِ ٱللَّهِ مِنۡ أَوۡلِيَآءَ ثُمَّ لَا تُنصَرُونَ",en:"And do not incline toward those who do wrong, lest you be touched by the Fire, and you would not have other than Allah any protectors; then you would not be helped",tr:"Wala tarkanoo ila allatheena thalamoo fatamassakumu alnnaru wama lakum min dooni Allahi min awliyaa thumma la tunsaroona"},114:{ar:"وَأَقِمِ ٱلصَّلَوٰةَ طَرَفَيِ ٱلنَّهَارِ وَزُلَفٗا مِّنَ ٱلَّيۡلِۚ إِنَّ ٱلۡحَسَنَٰتِ يُذۡهِبۡنَ ٱلسَّيِّـَٔاتِۚ ذَٰلِكَ ذِكۡرَىٰ لِلذَّـٰكِرِينَ",en:"And establish prayer at the two ends of the day and at the approach of the night. Indeed, good deeds do away with misdeeds. That is a reminder for those who remember",tr:"Waaqimi alssalata tarafayi alnnahari wazulafan mina allayli inna alhasanati yuthhibna alssayyiati thalika thikra lilththakireena"},115:{ar:"وَٱصۡبِرۡ فَإِنَّ ٱللَّهَ لَا يُضِيعُ أَجۡرَ ٱلۡمُحۡسِنِينَ",en:"And be patient, for indeed, Allah does not allow to be lost the reward of those who do good",tr:"Waisbir fainna Allaha la yudeeAAu ajra almuhsineena"},116:{ar:"فَلَوۡلَا كَانَ مِنَ ٱلۡقُرُونِ مِن قَبۡلِكُمۡ أُوْلُواْ بَقِيَّةٖ يَنۡهَوۡنَ عَنِ ٱلۡفَسَادِ فِي ٱلۡأَرۡضِ إِلَّا قَلِيلٗا مِّمَّنۡ أَنجَيۡنَا مِنۡهُمۡۗ وَٱتَّبَعَ ٱلَّذِينَ ظَلَمُواْ مَآ أُتۡرِفُواْ فِيهِ وَكَانُواْ مُجۡرِمِينَ",en:"So why were there not among the generations before you those of enduring discrimination forbidding corruption on earth - except a few of those We saved from among them? But those who wronged pursued what luxury they were given therein, and they were criminals",tr:"Falawla kana mina alqurooni min qablikum oloo baqiyyatin yanhawna AAani alfasadi fee alardi illa qaleelan mimman anjayna minhum waittabaAAa allatheena thalamoo ma otrifoo feehi wakanoo mujrimeena"},117:{ar:"وَمَا كَانَ رَبُّكَ لِيُهۡلِكَ ٱلۡقُرَىٰ بِظُلۡمٖ وَأَهۡلُهَا مُصۡلِحُونَ",en:"And your Lord would not have destroyed the cities unjustly while their people were reformers",tr:"Wama kana rabbuka liyuhlika alqura bithulmin waahluha muslihoona"},118:{ar:"وَلَوۡ شَآءَ رَبُّكَ لَجَعَلَ ٱلنَّاسَ أُمَّةٗ وَٰحِدَةٗۖ وَلَا يَزَالُونَ مُخۡتَلِفِينَ",en:"And if your Lord had willed, He could have made mankind one community; but they will not cease to differ",tr:"Walaw shaa rabbuka lajaAAala alnnasa ommatan wahidatan wala yazaloona mukhtalifeena"},119:{ar:"إِلَّا مَن رَّحِمَ رَبُّكَۚ وَلِذَٰلِكَ خَلَقَهُمۡۗ وَتَمَّتۡ كَلِمَةُ رَبِّكَ لَأَمۡلَأَنَّ جَهَنَّمَ مِنَ ٱلۡجِنَّةِ وَٱلنَّاسِ أَجۡمَعِينَ",en:'Except whom your Lord has given mercy, and for that He created them. But the word of your Lord is to be fulfilled that, "I will surely fill Hell with jinn and men all together',tr:"Illa man rahima rabbuka walithalika khalaqahum watammat kalimatu rabbika laamlaanna jahannama mina aljinnati waalnnasi ajmaAAeena"},120:{ar:"وَكُلّٗا نَّقُصُّ عَلَيۡكَ مِنۡ أَنۢبَآءِ ٱلرُّسُلِ مَا نُثَبِّتُ بِهِۦ فُؤَادَكَۚ وَجَآءَكَ فِي هَٰذِهِ ٱلۡحَقُّ وَمَوۡعِظَةٞ وَذِكۡرَىٰ لِلۡمُؤۡمِنِينَ",en:"And each [story] We relate to you from the news of the messengers is that by which We make firm your heart. And there has come to you, in this, the truth and an instruction and a reminder for the believers",tr:"Wakullan naqussu AAalayka min anbai alrrusuli ma nuthabbitu bihi fuadaka wajaaka fee hathihi alhaqqu wamawAAithatun wathikra lilmumineena"},121:{ar:"وَقُل لِّلَّذِينَ لَا يُؤۡمِنُونَ ٱعۡمَلُواْ عَلَىٰ مَكَانَتِكُمۡ إِنَّا عَٰمِلُونَ",en:'And say to those who do not believe, "Work according to your position; indeed, we are working',tr:"Waqul lillatheena la yuminoona iAAmaloo AAala makanatikum inna AAamiloona"},122:{ar:"وَٱنتَظِرُوٓاْ إِنَّا مُنتَظِرُونَ",en:"And wait, indeed, we are waiting",tr:"Waintathiroo inna muntathiroona"},123:{ar:"وَلِلَّهِ غَيۡبُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ وَإِلَيۡهِ يُرۡجَعُ ٱلۡأَمۡرُ كُلُّهُۥ فَٱعۡبُدۡهُ وَتَوَكَّلۡ عَلَيۡهِۚ وَمَا رَبُّكَ بِغَٰفِلٍ عَمَّا تَعۡمَلُونَ",en:"And to Allah belong the unseen [aspects] of the heavens and the earth and to Him will be returned the matter, all of it, so worship Him and rely upon Him. And your Lord is not unaware of that which you do",tr:"Walillahi ghaybu alssamawati waalardi wailayhi yurjaAAu alamru kulluhu faoAAbudhu watawakkal AAalayhi wama rabbuka bighafilin AAamma taAAmaloona"}}},extrasSuggest:[{id:"dhuhrS",t:"Dhuhr Sunnah",s:"4 before, 2 after"},{id:"duha",t:"Ḍuḥā prayer",s:"After sunrise, before Dhuhr"},{id:"move",t:"30 minutes physical",s:"Walk, train, play"}],cards:[{week:"2026-10-12",good:{ar:"حُبُّ الآخِرَة",en:"Love of the Hereafter",quran:[{ar:"وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ كَانَ سَعْيُهُم مَّشْكُورًا",en:"Whoever desires the Hereafter and strives for it as it deserves, while a believer, their striving will be appreciated.",ref:"Al-Isrāʾ 17:19"},{ar:"وَإِنَّ الدَّارَ الْآخِرَةَ لَهِيَ الْحَيَوَانُ ۚ لَوْ كَانُوا يَعْلَمُونَ",en:"The Home of the Hereafter is the real life, if only they knew.",ref:"Al-ʿAnkabūt 29:64"}],hadith:[{t:"Whoever makes the Hereafter his concern, Allah places richness in his heart and the world comes to him in submission.",src:"At-Tirmidhī"},{t:"Be in this world as if you were a stranger or a traveller.",src:"Al-Bukhārī"}]},bad:{ar:"حُبُّ الدُّنْيَا",en:"Love of the Dunya",quran:[{ar:"كَلَّا بَلْ تُحِبُّونَ الْعَاجِلَةَ ۝ وَتَذَرُونَ الْآخِرَةَ",en:"No! You love the fleeting life and abandon the Hereafter.",ref:"Al-Qiyāmah 75:20–21"},{ar:"بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا ۝ وَالْآخِرَةُ خَيْرٌ وَأَبْقَىٰ",en:"But you prefer the worldly life, while the Hereafter is better and more lasting.",ref:"Al-Aʿlā 87:16–17"}],hadith:[{t:"“Allah will cast wahn into your hearts.” It was asked, “What is wahn?” He said: “Love of the world and hatred of death.”",src:"Abū Dāwūd"},{t:"Two hungry wolves let loose among sheep do no more damage than a man’s greed for wealth and status does to his religion.",src:"At-Tirmidhī"}]}},{week:"2026-10-05",good:{ar:"الحياء",en:"Ḥayāʾ (Modesty)",quran:[{ar:"قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ ۚ ذَٰلِكَ أَزْكَىٰ لَهُمْ",en:"Tell the believing men to lower their gazes and guard their private parts. That is purer for them.",ref:"Al-Nūr 24:30"},{ar:"وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا",en:"The servants of the Most Merciful are those who walk upon the earth humbly.",ref:"Al-Furqān 25:63"}],hadith:[{t:"Īmān consists of more than sixty branches, and Ḥayāʾ is a part of Īmān.",src:"Al-Bukhārī"},{t:"Every dīn has a distinct characteristic, and the distinct characteristic of Islam is Ḥayāʾ.",src:"Ibn Mājah"}]},bad:{ar:"الفحش",en:"Shamelessness",quran:[{ar:"إِنَّ اللَّهَ لَا يُحِبُّ مَن كَانَ مُخْتَالًا فَخُورًا",en:"Indeed Allah does not love whoever is arrogant and boastful.",ref:"Al-Nisāʾ 4:36"},{ar:"وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا ۖ إِنَّكَ لَن تَخْرِقَ الْأَرْضَ وَلَن تَبْلُغَ الْجِبَالَ طُولًا",en:"Do not walk upon the earth arrogantly. You will never tear the earth apart, nor will you reach the mountains in height.",ref:"Al-Isrāʾ 17:37"}],hadith:[{t:"Shamelessness is part of hardness of heart, and hardness of heart is in the Fire.",src:"Ibn Mājah"},{t:"No one who has an atom’s weight of arrogance in his heart will enter Paradise.",src:"Muslim"},{t:"If you have no Ḥayāʾ, then do as you wish.",src:"Al-Bukhārī"}]}},{week:"2026-09-28",good:{ar:"الصِّدْق",en:"Truthfulness",quran:[{ar:"يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ",en:"O you who believe: fear Allah and be in the company of the
